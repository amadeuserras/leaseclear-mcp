[project]
name = "leaseclear-mcp"
version = "0.1.3"
description = "Standalone MCP server exposing LeaseClear Q&A as an MCP tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amadeu Serras" }]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.14",
]

[project.urls]
Homepage = "https://github.com/amadeuserras/leaseclear-mcp"
Repository = "https://github.com/amadeuserras/leaseclear-mcp"


[project.scripts]
leaseclear-mcp = "leaseclear_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]
