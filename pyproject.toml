[project]
name = "lease-qa-mcp"
version = "0.1.0"
description = "Standalone MCP server exposing LeaseClear Q&A as an MCP tool"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.14",
]

[project.scripts]
lease-qa-mcp = "lease_qa_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.2",
]
